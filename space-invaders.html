<!DOCTYPE html>
<!--
  Space Invaders (1978 arcade), one player. One offline file.
  Private use only.

  Sections (in order):
    HEAD/CSS          styles (white on black only)
    DOM               stage, canvas and footer
    ARCADE            shared logic (same copy in pong.html and space-invaders.html)
    CONST             fixed numbers (requirements and sources)
    RULES             pure game engine
    DATA              art and text
    VIEW              pure renderer
    APP               pure screen state machine
    ARCADE PLATFORM   shared browser layer (same copy in both games)
    PLATFORM          drawing for this game
    BOOT              start-up

  ARCADE to APP sit between the LOGIC markers. They use no DOM, storage or
  audio. Node tests load that block with tests/helpers/load-arcade.mjs.

  Tests:
    npm test           unit tests (node:test, no packages)
    npm run test:e2e   Playwright end-to-end tests (dev only)

  Plan: docs/arcade-build-plan.md. Requirements: docs/arcade-requirements.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPACE INVADERS</title>
<style>
/* ===== HEAD/CSS ===== */
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; }
body { display: flex; flex-direction: column; font-family: "Courier New", Courier, monospace; }
#stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; }
#screen { display: block; background: #000; image-rendering: pixelated; image-rendering: crisp-edges; }
#footer {
  flex: none; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline;
  gap: 2px 16px; padding: 6px 10px; border-top: 1px solid #fff; background: #000; font-size: 13px; line-height: 1.35;
}
#footer kbd { font-family: inherit; font-weight: 700; }
#footer .item, #sound { white-space: nowrap; }
#notice { margin: 0; font-weight: 700; white-space: nowrap; }
#notice[hidden] { display: none; }
#keys .item { margin: 0 8px; }
</style>
</head>
<body>
<!-- ===== DOM ===== -->
<main id="stage"><canvas id="screen" width="224" height="256" aria-label="Space Invaders game screen"></canvas></main>
<footer id="footer"><span id="keys"></span><span id="sound"></span><p id="notice" hidden>Scores not saved</p></footer>

<script>
/* ==BEGIN LOGIC== */
/* ===== ARCADE ===== */
// Shared logic. pong.html and space-invaders.html hold the same copy of this
// section. tests/unit/arcade-common.test.mjs runs one suite against each file.
var ARCADE = (function () {
  'use strict';

  function has(obj, key) { return Object.prototype.hasOwnProperty.call(obj, key); }

  // Fixed-timestep accumulator (copy of the Tetris ticker). advance(nowMs)
  // returns how many game frames to run. Catch-up is capped; when the cap is
  // hit (for example after a tab restore) the rest of the backlog is dropped.
  function createTicker(fps, maxSteps) {
    var stepMs = 1000 / fps;
    var cap = maxSteps || 5;
    var acc = 0, last = null;
    return {
      advance: function (now) {
        if (last === null) { last = now; return 0; }
        var dt = Math.max(0, now - last);
        last = now;
        acc += dt;
        var n = Math.floor(acc / stepMs);
        if (n > cap) { n = cap; acc = 0; } else { acc -= n * stepMs; }
        return n;
      },
      reset: function () { acc = 0; last = null; }
    };
  }

  // ---- Input. keyMap maps KeyboardEvent.code to an action name; several
  // codes may share an action. OS key repeat is ignored. Ctrl, Alt and Meta
  // combinations are ignored (requirements S4).
  function createInput(keyMap) {
    var codes = Object.keys(keyMap);
    var actions = [];
    codes.forEach(function (c) { if (actions.indexOf(keyMap[c]) < 0) actions.push(keyMap[c]); });
    var down = {};     // code -> true while held
    var pressed = {};  // code -> true, pressed since the last frame

    // e: { code, repeat, ctrlKey, altKey, metaKey }. Returns true when the
    // page should call preventDefault.
    function keyDown(e) {
      if (e.ctrlKey || e.altKey || e.metaKey) return false;
      var known = has(keyMap, e.code);
      if (e.repeat) return known;
      down[e.code] = true;
      pressed[e.code] = true;
      return known;
    }

    function keyUp(e) {
      delete down[e.code];
      return has(keyMap, e.code);
    }

    function clear() { down = {}; pressed = {}; }

    // Snapshot for one game frame. A tap that started and ended inside the
    // frame still counts as held for that frame.
    function frame() {
      var held = {}, edge = {};
      actions.forEach(function (a) { held[a] = false; edge[a] = false; });
      codes.forEach(function (c) {
        var a = keyMap[c];
        if (pressed[c]) edge[a] = true;
        if (down[c] || pressed[c]) held[a] = true;
      });
      pressed = {};
      return { held: held, pressed: edge };
    }

    return { keyDown: keyDown, keyUp: keyUp, clear: clear, frame: frame };
  }

  // ---- Storage adapter. getBackend returns a localStorage-like object and
  // may throw. Any error after the probe, and any corrupt value (bad JSON or
  // a validator that returns null), drops the backend for the session: ok
  // becomes false and later loads and saves use memory only (requirements S10).
  function createStore(getBackend, prefix) {
    var store = { ok: true };
    var memory = {};
    var backend = null;
    try {
      backend = getBackend();
      var probe = prefix + 'probe';
      backend.setItem(probe, '1');
      backend.removeItem(probe);
    } catch (e) {
      backend = null;
      store.ok = false;
    }

    function fail() { backend = null; store.ok = false; }

    store.load = function (name, validate, fallback) {
      var raw = null;
      if (backend) {
        try { raw = backend.getItem(prefix + name); } catch (e) { fail(); }
      }
      if (!backend) raw = has(memory, name) ? memory[name] : null;
      if (raw === null || raw === undefined) return fallback();
      var value = null;
      try { value = validate(JSON.parse(raw)); } catch (e) { value = null; }
      if (value === null) { fail(); return fallback(); }
      return value;
    };

    store.save = function (name, value) {
      var text = JSON.stringify(value);
      memory[name] = text;
      if (!backend) return false;
      try {
        backend.setItem(prefix + name, text);
        return true;
      } catch (e) {
        fail();
        return false;
      }
    };

    return store;
  }

  // ---- Top 10 (requirements S6 to S8). Entry: { name: 3 letters A-Z, score }.
  var MAX_ENTRIES = 10;
  var NAME_LEN = 3;
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  function validName(n) { return typeof n === 'string' && /^[A-Z]{3}$/.test(n); }

  function validScore(v, maxScore) {
    return typeof v === 'number' && Math.floor(v) === v && v >= 1 && v <= maxScore;
  }

  // Returns a clean copy, or null when anything is invalid: not an array,
  // more than 10 entries, a bad entry or an order that is not highest first.
  function validateScores(raw, maxScore) {
    if (!Array.isArray(raw) || raw.length > MAX_ENTRIES) return null;
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var e = raw[i];
      if (!e || typeof e !== 'object' || !validName(e.name) || !validScore(e.score, maxScore)) return null;
      if (i > 0 && e.score > out[i - 1].score) return null;
      out.push({ name: e.name, score: e.score });
    }
    return out;
  }

  // Above 0, and fewer than 10 entries or above the 10th (S8).
  function qualifies(list, score) {
    if (!(score > 0)) return false;
    return list.length < MAX_ENTRIES || score > list[MAX_ENTRIES - 1].score;
  }

  // Rank (0-based) a new score takes. Ties rank below older equal scores.
  function rankOf(list, score) {
    var i = 0;
    while (i < list.length && list[i].score >= score) i++;
    return i;
  }

  function insertScore(list, entry) {
    var out = list.slice();
    var r = rankOf(out, entry.score);
    out.splice(r, 0, { name: entry.name, score: entry.score });
    return { list: out.slice(0, MAX_ENTRIES), rank: r };
  }

  // ---- Name entry (S7). 3 slots, each starts at A. prevAction and
  // nextAction change the letter (wrapping A to Z and Z to A). Start accepts
  // the slot; after slot 3 step() returns the name.
  function createNameEntry(prevAction, nextAction) {
    var ne = { letters: ['A', 'A', 'A'], slot: 0 };

    function shift(ch, dir) {
      var i = LETTERS.indexOf(ch);
      return LETTERS[(i + dir + LETTERS.length) % LETTERS.length];
    }

    ne.step = function (inp) {
      var p = inp.pressed;
      if (p.start) {
        if (ne.slot === NAME_LEN - 1) return ne.letters.join('');
        ne.slot++;
        return null;
      }
      if (p[nextAction]) ne.letters[ne.slot] = shift(ne.letters[ne.slot], 1);
      else if (p[prevAction]) ne.letters[ne.slot] = shift(ne.letters[ne.slot], -1);
      return null;
    };

    return ne;
  }

  // Sound setting: a boolean, else null (corrupt).
  function validateSound(raw) { return typeof raw === 'boolean' ? raw : null; }

  return {
    createTicker: createTicker, createInput: createInput, createStore: createStore,
    MAX_ENTRIES: MAX_ENTRIES, NAME_LEN: NAME_LEN, LETTERS: LETTERS,
    validName: validName, validateScores: validateScores, qualifies: qualifies,
    rankOf: rankOf, insertScore: insertScore, createNameEntry: createNameEntry,
    validateSound: validateSound
  };
})();

var SI = {};

/* ===== CONST ===== */
// Numbers come from the requirements (docs/arcade-requirements.md, 3.3) or
// from the ROM disassembly by Mikael Agren (computerarcheology.com,
// Arcade/SpaceInvaders/Code.html). Hex addresses in comments are ROM
// addresses. Values stay in ROM units: Xr runs left to right, Yr runs bottom
// to top, and a pixel number is Xr * 256 + Yr.
SI.CONST = (function () {
  'use strict';
  return {
    FPS: 60,                    // Video interrupts at lines 96 and 224, 60 Hz (Hardware.html)
    SCREEN_W: 224,
    SCREEN_H: 256,
    STORAGE_PREFIX: 'spaceinvaders.v1.',
    MAX_SCORE: 9999,            // I11 (default): the score caps
    START_SHIPS: 3,             // I3; GetShipsPerCred 08D1 with DIP 0
    EXTRA_SHIP_MSB: 15,         // I3: 1,500 (0935, score MSB 0x15)
    ROWS: 5,
    COLS: 11,
    ALIENS: 55,                 // I1; InitAliens 01C0
    ALIEN_POINTS: [10, 10, 20, 20, 30],   // I2; AlienScoreValue 097C, row 0 at the bottom
    RACK_START_YR: 0x78,        // First rack (07EA)
    RACK_START_XR: 0x38,        // 07EA and 0A1E
    // Racks 2 to 9; index (rackCnt AND 7) + 1 (0A0C), so rack 10 repeats 0x60.
    RACK_YR_TABLE: [0x60, 0x50, 0x48, 0x48, 0x48, 0x40, 0x40, 0x40],   // 1DA3, owner decision O2
    RACK_DOWN: -8,              // rackDownDelta F8 (mirror 200E)
    INVADED_YR: 0x28,           // An alien below this Yr ends the game (016B)
    PLAYER_YR: 0x20,            // Mirror 201A
    PLAYER_XR: 0x30,            // Mirror 201B
    PLAYER_XR_MIN: 0x30,        // 038F
    PLAYER_XR_MAX: 0xD9,        // 0382
    PLAYER_START_DELAY: 0x80,   // Player task timer (mirror 2011)
    PLAYER_BLOW_STEPS: 12,      // expAnimateCnt (mirror 2017)
    PLAYER_BLOW_TICKS: 5,       // expAnimateTimer (02A7)
    ALIEN_FIRE_DELAY: 0x30,     // alienFireDelay (02A1)
    SHOT_YR: 0x28,              // Player shot start (mirror 2029)
    SHOT_DY: 4,                 // shotDeltaX (mirror 202C)
    SHOT_TOP_YR: 0xD8,          // Miss at the top (14E4)
    SAUCER_HIT_YR: 0xCE,        // A hit above this Yr is the saucer (14F0)
    SHOT_BLOW_TICKS: 0x10,      // blowUpTimer (mirror 2026)
    ALIEN_BLOW_TICKS: 0x10,     // expAlienTimer (152A)
    SHIELD_XR: [0x40, 0x6D, 0x9A, 0xC7],  // 0224 and +0x2E0 per shield (023A)
    SHIELD_YR: 0x30,            // Screen byte 6 (0224)
    BOTTOM_LINE_YR: 16,         // DrawBottomLine 01CF
    EDGE_RIGHT_XR: 0xF5,        // RackBump 159E: screen 3EA4
    EDGE_LEFT_XR: 0x29,         // RackBump 15B7: screen 2524
    // Fleet sound (1775): first count not above the live aliens gives the delay.
    FLEET_COUNTS: [0x32, 0x2B, 0x24, 0x1C, 0x16, 0x11, 0x0D, 0x0A, 0x08, 0x07, 0x06, 0x05, 0x04, 0x03, 0x02, 0x01],
    FLEET_DELAYS: [0x34, 0x2E, 0x27, 0x22, 0x1C, 0x18, 0x15, 0x13, 0x10, 0x0E, 0x0D, 0x0C, 0x0B, 0x09, 0x07, 0x05],
    FLEET_HOLD: 4,              // fleetSndHold (1767)
    // Column-firing table (ColFireTable 1D00): plunger uses 0x00-0x0F,
    // squiggly uses 0x06-0x14 (04DC, 0529).
    COL_TABLE: [0x01, 0x07, 0x01, 0x01, 0x01, 0x04, 0x0B, 0x01, 0x06, 0x03, 0x01, 0x01, 0x0B, 0x09, 0x02, 0x08,
      0x02, 0x0B, 0x04, 0x07, 0x0A],
    PLUNGER_WRAP: 0x10,
    SQUIGGLY_START: 0x06,
    SQUIGGLY_WRAP: 0x15,
    SHOT_END_YR: 0x15,          // An alien shot below this Yr ends (05F6)
    PLAYER_HIT_LO: 0x1E,        // A hit in Yr 0x1E-0x26 strikes the player (0603, 0608)
    PLAYER_HIT_HI: 0x27,
    SHOT_BLOW_COUNT: 4,         // aShotBlowCnt (mirror 203A)
    // Saucer (SaucerScrTab 1D54, first 15 entries; the 044C wrap is kept for I7).
    SAUCER_SCORES: [100, 50, 50, 100, 150, 100, 100, 50, 300, 100, 100, 100, 50, 150, 100],
    SAUCER_TIME: 0x0600,        // tillSaucer (0921)
    SAUCER_YR: 0xD0,            // Mirror 2089
    SAUCER_XR: 0x29,            // Mirror 208A
    SAUCER_MIN_ALIENS: 8,       // 06A1
    SAUCER_HIT_TIME: 0x20,      // Mirror 2086
    PROMPT_TICKS: 0xB0,         // PromptPlayer 08A4
    RACK_END_TICKS: 0x30,       // 0A42
    LETTER_TICKS: 7             // PrintMessageDel 0A99
  };
})();

/* ===== DATA ===== */
// Art is redrawn by eye at the ROM sizes (plan decision 15). No ROM bitmap
// bytes are copied. Each picture is drawn the way it shows on the screen
// ('*' is a lit pixel) and converted to ROM-style column bytes: one byte per
// Xr column, bit 0 at the lowest Yr.
SI.DATA = (function () {
  'use strict';

  // 8 rows of art -> one byte per column (row 0 is the top, bit 7).
  function columns(rows) {
    var out = [];
    for (var x = 0; x < rows[0].length; x++) {
      var b = 0;
      for (var r = 0; r < 8; r++) if (rows[r][x] === '*') b |= 1 << (7 - r);
      out.push(b);
    }
    return out;
  }

  // Pads art on the left and right to the ROM sprite width.
  function pad(rows, left, width) {
    return rows.map(function (r) {
      var s = new Array(left + 1).join('.') + r;
      while (s.length < width) s += '.';
      return s;
    });
  }

  // ---- Aliens: 16 columns x 8 rows (DrawAlien 0131). Index by type:
  // 0 = bottom two rows (10 pts), 1 = middle two rows (20), 2 = top row (30).
  var ALIEN_ART = [
    [[ // Type A, 12 wide
      '....****....',
      '.**********.',
      '************',
      '***..**..***',
      '************',
      '...**..**...',
      '..**.**.**..',
      '**........**'
    ], [
      '....****....',
      '.**********.',
      '************',
      '***..**..***',
      '************',
      '..***..***..',
      '.**..**..**.',
      '..**....**..'
    ], 2],
    [[ // Type B, 11 wide
      '..*.....*..',
      '...*...*...',
      '..*******..',
      '.**.***.**.',
      '***********',
      '*.*******.*',
      '*.*.....*.*',
      '...**.**...'
    ], [
      '..*.....*..',
      '*..*...*..*',
      '*.*******.*',
      '***.***.***',
      '***********',
      '.*********.',
      '..*.....*..',
      '.*.......*.'
    ], 3],
    [[ // Type C, 8 wide
      '...**...',
      '..****..',
      '.******.',
      '**.**.**',
      '********',
      '..*..*..',
      '.*.**.*.',
      '*.*..*.*'
    ], [
      '...**...',
      '..****..',
      '.******.',
      '**.**.**',
      '********',
      '.*.**.*.',
      '*......*',
      '.*....*.'
    ], 4]
  ];
  var ALIENS = ALIEN_ART.map(function (a) {
    return [columns(pad(a[0], a[2], 16)), columns(pad(a[1], a[2], 16))];
  });

  var ALIEN_EXPLOSION = columns(pad([
    '....*...*....',
    '.*...*.*...*.',
    '..*.......*..',
    '...*.....*...',
    '**.........**',
    '...*.....*...',
    '..*..*.*..*..',
    '.*..*...*..*.'
  ], 1, 16));

  // ---- Player: 16 columns x 8 rows, 13 wide (PlayerSprite 1C60 size).
  var PLAYER = columns(pad([
    '......*......',
    '.....***.....',
    '.....***.....',
    '.***********.',
    '*************',
    '*************',
    '*************',
    '*************'
  ], 2, 16));

  var PLAYER_BLOWUP = [columns(pad([
    '.....*.......',
    '..*.......*..',
    '.....*.*.....',
    '*..*.***...*.',
    '...*******...',
    '.*********.*.',
    '*************',
    '.***********.'
  ], 2, 16)), columns(pad([
    '...*....*....',
    '*.....*...*..',
    '..*.*......*.',
    '....*..*.....',
    '.*.*****.*...',
    '..*******..*.',
    '.***********.',
    '*************'
  ], 2, 16))];

  // ---- Player shot: 1 column, 4 pixels (1C90 size). Explosion: 8 x 8 (1C91).
  var SHOT = columns(['.', '.', '.', '.', '*', '*', '*', '*']);
  var SHOT_EXPLOSION = columns([
    '*..**..*',
    '..****..',
    '.******.',
    '*.****.*',
    '.******.',
    '..****..',
    '.*.**.*.',
    '*..**..*'
  ]);

  // ---- Alien shots: 4 frames of 3 columns. Explosion: 6 columns (1CDC size).
  function frames(list) { return list.map(columns); }
  var ROLLING = frames([
    ['.*.', '.*.', '.*.', '.*.', '.*.', '.*.', '.*.', '...'],
    ['.*.', '.**', '.*.', '.*.', '**.', '.*.', '.*.', '...'],
    ['.*.', '.*.', '.*.', '.*.', '.*.', '.*.', '.*.', '...'],
    ['.*.', '**.', '.*.', '.*.', '.**', '.*.', '.*.', '...']
  ]);
  var PLUNGER = frames([
    ['.*.', '.*.', '.*.', '.*.', '.*.', '***', '...', '...'],
    ['.*.', '.*.', '.*.', '***', '.*.', '.*.', '...', '...'],
    ['.*.', '.*.', '***', '.*.', '.*.', '.*.', '...', '...'],
    ['***', '.*.', '.*.', '.*.', '.*.', '.*.', '...', '...']
  ]);
  var SQUIGGLY = frames([
    ['.*.', '*..', '.*.', '..*', '.*.', '*..', '.*.', '...'],
    ['*..', '.*.', '..*', '.*.', '*..', '.*.', '..*', '...'],
    ['.*.', '..*', '.*.', '*..', '.*.', '..*', '.*.', '...'],
    ['..*', '.*.', '*..', '.*.', '..*', '.*.', '*..', '...']
  ]);
  var ALIEN_SHOT_EXPLOSION = columns([
    '.*..*.',
    '*.**..',
    '.****.',
    '******',
    '.****.',
    '*.**.*',
    '.*..*.',
    '......'
  ]);

  // ---- Saucer: 24 columns (SpriteSaucer 1D64 size), 16 wide in the middle.
  var SAUCER = columns(pad([
    '.....******.....',
    '...**********...',
    '..************..',
    '.**.**.**.**.**.',
    '****************',
    '..***..**..***..',
    '...*........*...',
    '................'
  ], 4, 24));
  var SAUCER_EXPLOSION = columns(pad([
    '..*....*..*...*....*..',
    '*...*.....*......*...*',
    '..*...*.*****.*...*...',
    '....*.**********......',
    '.*...**.**.**.**..*...',
    '...*..*********...*..*',
    '..*.....*.*.*.......*.',
    '*....*..........*.....'
  ], 1, 24));

  // ---- Shield: 22 columns x 16 rows (ShieldImage 1D20 size). Two bytes per
  // column in screen-memory order: Yr 48-55 first, then Yr 56-63.
  var SHIELD_ART = [
    '....**************....',
    '...****************...',
    '..******************..',
    '.********************.',
    '**********************',
    '**********************',
    '**********************',
    '**********************',
    '**********************',
    '**********************',
    '**********************',
    '**********************',
    '*******........*******',
    '******..........******',
    '*****............*****',
    '*****............*****'
  ];
  var SHIELD = (function () {
    var lo = columns(SHIELD_ART.slice(8)), hi = columns(SHIELD_ART.slice(0, 8));
    var out = [];
    for (var x = 0; x < lo.length; x++) out.push(lo[x], hi[x]);
    return out;
  })();

  // ---- Font: 8 x 8 cells, glyphs 5 x 7 (DrawChar 08FF uses 8-byte cells).
  var GLYPHS = {
    'A': ['.***.', '*...*', '*...*', '*****', '*...*', '*...*', '*...*'],
    'B': ['****.', '*...*', '*...*', '****.', '*...*', '*...*', '****.'],
    'C': ['.***.', '*...*', '*....', '*....', '*....', '*...*', '.***.'],
    'D': ['****.', '*...*', '*...*', '*...*', '*...*', '*...*', '****.'],
    'E': ['*****', '*....', '*....', '****.', '*....', '*....', '*****'],
    'F': ['*****', '*....', '*....', '****.', '*....', '*....', '*....'],
    'G': ['.***.', '*...*', '*....', '*.***', '*...*', '*...*', '.***.'],
    'H': ['*...*', '*...*', '*...*', '*****', '*...*', '*...*', '*...*'],
    'I': ['.***.', '..*..', '..*..', '..*..', '..*..', '..*..', '.***.'],
    'J': ['....*', '....*', '....*', '....*', '....*', '*...*', '.***.'],
    'K': ['*...*', '*..*.', '*.*..', '**...', '*.*..', '*..*.', '*...*'],
    'L': ['*....', '*....', '*....', '*....', '*....', '*....', '*****'],
    'M': ['*...*', '**.**', '*.*.*', '*.*.*', '*...*', '*...*', '*...*'],
    'N': ['*...*', '**..*', '*.*.*', '*..**', '*...*', '*...*', '*...*'],
    'O': ['.***.', '*...*', '*...*', '*...*', '*...*', '*...*', '.***.'],
    'P': ['****.', '*...*', '*...*', '****.', '*....', '*....', '*....'],
    'Q': ['.***.', '*...*', '*...*', '*...*', '*.*.*', '*..*.', '.**.*'],
    'R': ['****.', '*...*', '*...*', '****.', '*.*..', '*..*.', '*...*'],
    'S': ['.***.', '*...*', '*....', '.***.', '....*', '*...*', '.***.'],

// Pure port of the 1978 game logic. The engine owns a 1-bit copy of screen

      put(g, i, get(g, i) & ~(s & 0xFF) & 0xFF);
      if ((i & 31) < 31) put(g, i + 1, get(g, i + 1) & ~(s >> 8) & 0xFF);

      put(g, i, get(g, i) | (s & 0xFF));

      s.xr = (g.playerXr + 8) & 0xFF;

      s.yr = (s.yr - 2) & 0xFF;

      if (o2 && g.reloadRate >= o2) return;

// Pure renderer into a 224 x 256 framebuffer of 0 (black) and 1 (white).
// x runs left to right, y top to bottom. The game picture comes from the

    }
  }

  function text(fb, s, x, y) {
    for (var i = 0; i < s.length; i++) columns(fb, D.FONT[s[i]] || D.FONT[' '], x + 8 * i, y);
  }

      }

  // digit (2501) and spare cannons (2701).
  function hud(fb, o) {

    if (!o.blankScore) text(fb, digits4(o.score), 24, 24);
    text(fb, digits4(o.hi), 88, 24);
    if (o.lives === undefined) return;

  // score advance table (DrawAdvTable 1815, tables 1DBE and 1DCF); page 2:
  // Top 10 (S9). o: { score, hi, scores, prompt }.
  function renderAttract(fb, page, o) {
    clear(fb);
    hud(fb, { score: o.score, hi: o.hi });
    if (page === 0) {
      text(fb, D.TEXT.PLAY, 96, 64);
      text(fb, D.TEXT.INVADERS, 56, 88);
    } else if (page === 1) {
      text(fb, D.TEXT.ADVANCE, 32, 120);
      var rows = [[D.SAUCER.slice(4, 20), D.TEXT.MYSTERY], [D.ALIENS[2][0], D.TEXT.PTS30],
        [D.ALIENS[1][1], D.TEXT.PTS20], [D.ALIENS[0][0], D.TEXT.PTS10]];
      for (var i = 0; i < rows.length; i++) {
        columns(fb, rows[i][0], 64, 136 + 16 * i);
        text(fb, rows[i][1], 80, 136 + 16 * i);
      }
    } else {
      centered(fb, 'HIGH SCORES', 64);
      for (var r = 0; r < ARCADE.MAX_ENTRIES; r++) {
        var e = o.scores[r];
        var line = (r < 9 ? ' ' : '') + (r + 1) + '. ' + (e ? e.name + ' ' + digits4(e.score) : '--- ----');

          for (var i = 0; i < events.length; i++) {
            if (events[i].type === 'gameOver') {
              app.lastScore = app.game.score;
              app.screen = 'gameOver';
              app.timer = 0;
            }
          }
          break;
        case 'gameOver':
          R.step(app.game, {});
          if (++app.timer < BANNER_FRAMES) break;
          if (ARCADE.qualifies(app.scores, app.lastScore)) {
            app.nameEntry = ARCADE.createNameEntry('left', 'right');
            app.screen = 'nameEntry';
          } else {
            toAttract(0);
          }
          break;
        case 'nameEntry':
          var name = app.nameEntry.step(inp);
          if (name !== null) {
            app.scores = ARCADE.insertScore(app.scores, { name: name, score: app.lastScore }).list;
            store.save('scores', app.scores);
            app.nameEntry = null;
            toAttract(2);
          }
          break;
      }
      return events;
    };

    // True while the saucer sound should loop.
    app.ufoSound = function () {
      return app.screen === 'play' && !app.paused && !!app.game && (app.game.sound3 & 1) === 1;
    };

    // True while game sound must be held (pause).
    app.audioPaused = function () { return app.screen === 'play' && app.paused; };

    // True on the frames where PRESS ENTER shows.
    app.blinkOn = function () { return ((app.frame / BLINK_FRAMES) | 0) % 2 === 0; };

    app.render = function (fb) {
      if (app.screen === 'play' || app.screen === 'gameOver') {
        V.renderPlay(fb, app.game, { hi: app.hiScore(), label: app.paused ? 'PAUSE' : '' });
      } else if (app.screen === 'attract') {
        V.renderAttract(fb, app.page, { score: app.lastScore, hi: app.hiScore(), scores: app.scores, prompt: app.blinkOn() });
      } else {
        V.renderNameEntry(fb, app.nameEntry, { score: app.lastScore, hi: app.hiScore(), blink: app.blinkOn() });
      }
    };

    return app;
  }

  return {
    KEY_MAP: KEY_MAP, FOOTER_KEYS: FOOTER_KEYS, createApp: createApp,
    PAGE_FRAMES: PAGE_FRAMES, BLINK_FRAMES: BLINK_FRAMES, BANNER_FRAMES: BANNER_FRAMES
  };
})();
/* ==END LOGIC== */
</script>
<script>
/* ===== ARCADE PLATFORM ===== */
// Shared browser layer. pong.html and space-invaders.html hold the same copy
// of this section: canvas fit, footer, loop, keyboard, blur and audio.
var ARCADE_PLATFORM = (function () {
  'use strict';

  // Keeps the canvas at aspect w:h, as large as fits in the stage. The stage
  // background gives the black margins (requirements S3). onSize gets the
  // shown size in CSS pixels and the device pixel ratio.
  function fitCanvas(stage, canvas, w, h, onSize) {
    function fit() {
      var k = Math.min(stage.clientWidth / w, stage.clientHeight / h);
      var cw = Math.max(1, Math.floor(w * k)), ch = Math.max(1, Math.floor(h * k));
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      onSize(cw, ch, window.devicePixelRatio || 1);
    }
    fit();
    if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
    window.addEventListener('resize', fit);
  }

  // Footer (S12): keys, sound state and the storage notice. Rebuilt only
  // when something changes. keys: [[key, label], ...].
  function createFooter(keysEl, soundEl, noticeEl) {
    var last = '';
    return function update(keys, soundOn, storeOk) {
      var sig = JSON.stringify([keys, soundOn, storeOk]);
      if (sig === last) return;
      last = sig;
      keysEl.textContent = '';
      keys.forEach(function (k) {
        var span = document.createElement('span');
        span.className = 'item';
        var kbd = document.createElement('kbd');
        kbd.textContent = k[0];
        span.appendChild(kbd);
        span.appendChild(document.createTextNode(' ' + k[1]));
        keysEl.appendChild(span);
      });
      soundEl.textContent = 'SOUND: ' + (soundOn ? 'ON' : 'OFF');
      noticeEl.hidden = storeOk;
    };
  }

  // Runs step() at the fixed game rate and render() once per animation frame.
  function startLoop(fps, step, render) {
    var ticker = ARCADE.createTicker(fps, 5);
    function frame(now) {
      var n = ticker.advance(now);
      for (var i = 0; i < n; i++) step();
      render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    return ticker;
  }

  // Keyboard, blur and visibility. onAway runs when the page loses focus or
  // is hidden (S11); onBack runs when it is visible again.
  function bindInput(input, onAway, onBack) {
    window.addEventListener('keydown', function (e) {
      if (input.keyDown(e)) e.preventDefault();
    });
    window.addEventListener('keyup', function (e) {
      if (input.keyUp(e)) e.preventDefault();
    });
    window.addEventListener('blur', onAway);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) onAway(); else onBack();
    });
  }

  // ---- Audio (S5): synthesized effects only. The AudioContext is made on
  // the first key press (browsers block autoplay). Any WebAudio failure
  // leaves the game silent. While muted or paused, no new sound starts.
  function createAudio() {
    var ctx = null, master = null, noiseBuf = null;
    var failed = false, muted = false, paused = false;
    var loops = {};

    function unlock() {
      if (ctx || failed) return;
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { failed = true; return; }
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : 1;
        master.connect(ctx.destination);
        if (paused) ctx.suspend();
      } catch (e) {
        failed = true;
        ctx = null;
      }
    }

    function live() { return !!ctx && !failed && !muted && !paused; }

    function envelope(g, t, end, level, decay) {
      g.gain.setValueAtTime(level, t);
      if (decay) g.gain.linearRampToValueAtTime(0, end);
      else g.gain.setValueAtTime(level, end);
    }

    // A tone at freq Hz for ms milliseconds. opts: type (default square),
    // gain, endFreq (slide), decay (fade to 0).
    function tone(freq, ms, opts) {
      if (!live()) return;
      opts = opts || {};
      try {
        var t = ctx.currentTime, end = t + ms / 1000;
        var osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = opts.type || 'square';
        osc.frequency.value = freq;
        osc.frequency.setValueAtTime(freq, t);
        if (opts.endFreq) osc.frequency.linearRampToValueAtTime(opts.endFreq, end);
        envelope(g, t, end, opts.gain || 0.12, opts.decay);
        osc.connect(g);
        g.connect(master);
        osc.start(t);
        osc.stop(end);
      } catch (e) {
        failed = true;
      }
    }

    // Filtered white noise for ms milliseconds. opts: gain, filter (low-pass
    // cut-off in Hz), decay.
    function noise(ms, opts) {
      if (!live()) return;
      opts = opts || {};
      try {
        if (!noiseBuf) {
          noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
          var d = noiseBuf.getChannelData(0);
          for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        var t = ctx.currentTime, end = t + ms / 1000;
        var src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
        src.buffer = noiseBuf;
        src.loop = true;
        f.type = 'lowpass';
        f.frequency.value = opts.filter || 2000;
        envelope(g, t, end, opts.gain || 0.2, opts.decay !== false);
        src.connect(f);
        f.connect(g);
        g.connect(master);
        src.start(t);
        src.stop(end);
      } catch (e) {
        failed = true;
      }
    }

    // A continuous tone until stopLoop(id). Calling loop again for a live id
    // does nothing. opts: type, gain, lfoHz and lfoDepth (pitch warble).
    function loop(id, freq, opts) {
      if (!live() || loops[id]) return;
      opts = opts || {};
      try {
        var osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = opts.type || 'square';
        osc.frequency.value = freq;
        g.gain.value = opts.gain || 0.08;
        var nodes = [osc];
        if (opts.lfoHz) {
          var lfo = ctx.createOscillator(), depth = ctx.createGain();
          lfo.frequency.value = opts.lfoHz;
          depth.gain.value = opts.lfoDepth || freq / 4;
          lfo.connect(depth);
          depth.connect(osc.frequency);
          lfo.start();
          nodes.push(lfo);
        }
        osc.connect(g);
        g.connect(master);
        osc.start();
        loops[id] = nodes;
      } catch (e) {
        failed = true;
      }
    }

    function stopLoop(id) {
      var nodes = loops[id];
      if (!nodes) return;
      delete loops[id];
      nodes.forEach(function (n) { try { n.stop(); } catch (e) { /* already stopped */ } });
    }

    function stopAllLoops() { Object.keys(loops).forEach(stopLoop); }

    function setMuted(m) {
      if (m === muted) return;
      muted = m;
      if (m) stopAllLoops();
      if (!ctx) return;
      try { master.gain.value = m ? 0 : 1; } catch (e) { failed = true; }
    }

    // Pause and hidden tab suspend the context (S11).
    function setPaused(p) {
      if (p === paused) return;
      paused = p;
      if (p) stopAllLoops();
      if (!ctx) return;
      try { if (p) ctx.suspend(); else ctx.resume(); } catch (e) { failed = true; }
    }

    return {
      unlock: unlock, tone: tone, noise: noise, loop: loop, stopLoop: stopLoop,
      setMuted: setMuted, setPaused: setPaused
    };
  }

  return {
    fitCanvas: fitCanvas, createFooter: createFooter, startLoop: startLoop,
    bindInput: bindInput, createAudio: createAudio
  };
})();

/* ===== PLATFORM ===== */
var PLATFORM = (function () {
  'use strict';
  var V = SI.VIEW, W = V.W, H = V.H;

  // Framebuffer -> 224 x 256 ImageData -> integer-scaled canvas. CSS
  // stretches the small remainder with image-rendering: pixelated (S3).
  function createScreen(canvas) {
    var off = document.createElement('canvas');
    off.width = W; off.height = H;
    var offCtx = off.getContext('2d');
    var image = offCtx.createImageData(W, H);
    var ctx = canvas.getContext('2d');
    var fb = V.createFramebuffer();

    function resize(cssW, cssH, dpr) {
      var k = Math.max(1, Math.floor(Math.min(cssW * dpr / W, cssH * dpr / H)));
      if (canvas.width !== W * k) { canvas.width = W * k; canvas.height = H * k; }
    }

    function present() {
      var d = image.data;
      for (var i = 0; i < fb.length; i++) {
        var v = fb[i] ? 255 : 0, j = i * 4;
        d[j] = v; d[j + 1] = v; d[j + 2] = v; d[j + 3] = 255;
      }
      offCtx.putImageData(image, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
    }

    return { fb: fb, resize: resize, present: present };
  }

  // Sound effects (I12). Pitches are chosen by ear (plan R10). The march
  // plays 4 low tones in turn, each about 4 ticks long (1767).
  var MARCH_HZ = [98, 87, 78, 69];

  function playEvents(audio, events) {
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.type === 'march') audio.tone(MARCH_HZ[e.tone & 3], 70, { gain: 0.25 });
      else if (e.type === 'shot') audio.noise(260, { filter: 3500, gain: 0.12 });
      else if (e.type === 'alienHit') audio.tone(320, 110, { endFreq: 60, gain: 0.18, decay: true });
      else if (e.type === 'playerHit') audio.noise(900, { filter: 700, gain: 0.3 });
      else if (e.type === 'saucerHit') audio.tone(1200, 500, { endFreq: 150, gain: 0.12, decay: true });
      else if (e.type === 'extraLife') audio.tone(880, 300, { gain: 0.1 });
    }
  }

  return { createScreen: createScreen, playEvents: playEvents, MARCH_HZ: MARCH_HZ };
})();

/* ===== BOOT ===== */
(function () {
  'use strict';
  var canvas = document.getElementById('screen');
  var screen = PLATFORM.createScreen(canvas);
  ARCADE_PLATFORM.fitCanvas(document.getElementById('stage'), canvas, SI.CONST.SCREEN_W, SI.CONST.SCREEN_H,
    function (w, h, dpr) { screen.resize(w, h, dpr); });
  var footer = ARCADE_PLATFORM.createFooter(document.getElementById('keys'),
    document.getElementById('sound'), document.getElementById('notice'));
  var store = ARCADE.createStore(function () { return window.localStorage; }, SI.CONST.STORAGE_PREFIX);
  var app = SI.APP.createApp({ store: store });
  var input = ARCADE.createInput(SI.APP.KEY_MAP);
  var audio = ARCADE_PLATFORM.createAudio();
  window.addEventListener('keydown', function () { audio.unlock(); }, true);
  var ticker = ARCADE_PLATFORM.startLoop(SI.CONST.FPS, function () {
    var events = app.step(input.frame());
    audio.setMuted(!app.soundOn);
    audio.setPaused(app.audioPaused());
    PLATFORM.playEvents(audio, events);
    if (app.ufoSound()) audio.loop('ufo', 450, { lfoHz: 7, lfoDepth: 180, gain: 0.06 });
    else audio.stopLoop('ufo');
  }, function () {
    app.render(screen.fb);
    screen.present();
    footer(SI.APP.FOOTER_KEYS, app.soundOn, store.ok);
  });
  ARCADE_PLATFORM.bindInput(input, function () {
    input.clear();
    app.pause();
    audio.setPaused(true);
  }, function () {
    ticker.reset();
    audio.setPaused(app.audioPaused());
  });
  // Read-only handle for end-to-end tests.
  window.siApp = app;
})();
</script>
</body>
