<!DOCTYPE html>
<!--
  Game Boy Tetris (1989, A-Type) clone. One offline file. Private use only.

  Sections (in order):
    HEAD/CSS   styles
    DOM shell  device markup
    CONST      fixed numbers (requirements + disassembly)
    RULES      pure game engine
    DATA       tiles, font, layouts, music notes
    VIEW       pure 160x144 framebuffer renderer
    APP        pure screen state machine
    PLATFORM   canvas, loop, keyboard, storage, audio
    BOOT       start-up

  CONST to APP sit between the LOGIC markers. They use no DOM, storage or audio.
  Node tests load that block with tests/helpers/load-logic.mjs.

  Tests:
    npm test           unit tests (node:test, no packages)
    npm run test:e2e   Playwright end-to-end tests (dev only)

  Rule numbers not in docs/requirements.md come from the MIT-licensed
  disassembly https://github.com/vinheim3/tetris-gb-disasm (file names cited).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TETRIS</title>
<style>
/* ===== HEAD/CSS ===== */
html, body { margin: 0; height: 100%; overflow: hidden; background: #4e4e4e; }
#screen { display: block; margin: 0 auto; image-rendering: pixelated; }
</style>
</head>
<body>
<!-- ===== DOM shell ===== -->
<canvas id="screen" width="160" height="144"></canvas>
<p id="notice" hidden>Scores not saved</p>

<script>
/* ==BEGIN LOGIC== */
var GB = {};

/* ===== CONST ===== */
GB.CONST = (function () {
  return Object.freeze({
    // Four shades, light to dark. Sampled from reference/screenshots/*.png:
    // exact-color pixel counts over the play, title and level screenshots.
    // Each shade is the most frequent color in a flat region, after
    // excluding colors within RGB distance 30 of a shade already chosen
    // (this drops the scaling blur between shades).
    PALETTE: Object.freeze(['#ffed79', '#b4a446', '#847947', '#4e4e4e']),

    SCREEN_W: 160,
    SCREEN_H: 144,

    // Requirements 2.3: frame rate and gravity (frames per row, levels 0..20).
    FPS: 59.73,
    GRAVITY: Object.freeze([53, 49, 45, 41, 37, 33, 28, 22, 17, 11, 10,
      9, 8, 7, 6, 6, 5, 5, 4, 4, 3]),

    // Requirements 2.3: horizontal repeat (23 from the ROM, inGameFlow.s $2517, $2525).
    DAS_DELAY: 23,
    DAS_REPEAT: 9,
    // Requirements 2.3: soft drop one row every 3 frames (inGameFlow.s $2092).
    SOFT_DROP_INTERVAL: 3,

    // Requirements 2.3: clear scores, multiplied by (level + 1).
    LINE_SCORES: Object.freeze([40, 100, 300, 1200]),
    MAX_START_LEVEL: 9,
    MAX_LEVEL: 20,
    MAX_SCORE: 999999,
    // Lines counter is 4 BCD digits (inGameFlow.s $2194).
    MAX_LINES: 9999,

    FIELD_W: 10,
    FIELD_H: 18,

    STORAGE_PREFIX: 'gbtetris.v1.'
  });
})();

/* ===== RULES ===== */
// Frame-exact port of the A-Type in-game loop. Source files are in
// vinheim3/tetris-gb-disasm: disasm/code/inGameFlow.s (IGF), bank_000.s (B0),
// gfx.s, data/spriteData.s. One step() call equals one ROM frame:
// GameState00_InGameMain (B0 $1bce), the main-loop timer tick (B0 $02d6),
// then the VBlank handler (B0 $0199..$01cf).
GB.RULES = (function () {
  'use strict';
  var C = GB.CONST;
  var W = C.FIELD_W;
  var H = C.FIELD_H;

  var EMPTY = 0;
  // Tile ids are the ROM tile bytes. Flashing row tile: constants.s TILE_FLASHING_PIECE.
  var TILE_FLASH = 0x8c;

  // Piece IDs (requirements 2.3): L0 J1 I2 O3 Z4 S5 T6.
  // Rotation states: spriteData.s SpriteTiles_00..SpriteTiles_1b. Each state is a
  // 4x4 grid; each cell is [gridRow, gridCol, tile].
  var PIECES = [
    [[[2, 0, 0x84], [2, 1, 0x84], [2, 2, 0x84], [3, 0, 0x84]],
     [[1, 1, 0x84], [2, 1, 0x84], [3, 1, 0x84], [3, 2, 0x84]],
     [[1, 2, 0x84], [2, 0, 0x84], [2, 1, 0x84], [2, 2, 0x84]],
     [[1, 0, 0x84], [1, 1, 0x84], [2, 1, 0x84], [3, 1, 0x84]]],
    [[[2, 0, 0x81], [2, 1, 0x81], [2, 2, 0x81], [3, 2, 0x81]],
     [[1, 1, 0x81], [1, 2, 0x81], [2, 1, 0x81], [3, 1, 0x81]],
     [[1, 0, 0x81], [2, 0, 0x81], [2, 1, 0x81], [2, 2, 0x81]],
     [[1, 1, 0x81], [2, 1, 0x81], [3, 0, 0x81], [3, 1, 0x81]]],
    [[[2, 0, 0x8a], [2, 1, 0x8b], [2, 2, 0x8b], [2, 3, 0x8f]],
     [[0, 1, 0x80], [1, 1, 0x88], [2, 1, 0x88], [3, 1, 0x89]],
     [[2, 0, 0x8a], [2, 1, 0x8b], [2, 2, 0x8b], [2, 3, 0x8f]],
     [[0, 1, 0x80], [1, 1, 0x88], [2, 1, 0x88], [3, 1, 0x89]]],
    [[[2, 1, 0x83], [2, 2, 0x83], [3, 1, 0x83], [3, 2, 0x83]],
     [[2, 1, 0x83], [2, 2, 0x83], [3, 1, 0x83], [3, 2, 0x83]],
     [[2, 1, 0x83], [2, 2, 0x83], [3, 1, 0x83], [3, 2, 0x83]],
     [[2, 1, 0x83], [2, 2, 0x83], [3, 1, 0x83], [3, 2, 0x83]]],
    [[[2, 0, 0x82], [2, 1, 0x82], [3, 1, 0x82], [3, 2, 0x82]],
     [[1, 1, 0x82], [2, 0, 0x82], [2, 1, 0x82], [3, 0, 0x82]],
     [[2, 0, 0x82], [2, 1, 0x82], [3, 1, 0x82], [3, 2, 0x82]],
     [[1, 1, 0x82], [2, 0, 0x82], [2, 1, 0x82], [3, 0, 0x82]]],
    [[[2, 1, 0x86], [2, 2, 0x86], [3, 0, 0x86], [3, 1, 0x86]],
     [[1, 0, 0x86], [2, 0, 0x86], [2, 1, 0x86], [3, 1, 0x86]],
     [[2, 1, 0x86], [2, 2, 0x86], [3, 0, 0x86], [3, 1, 0x86]],
     [[1, 0, 0x86], [2, 0, 0x86], [2, 1, 0x86], [3, 1, 0x86]]],
    [[[2, 0, 0x85], [2, 1, 0x85], [2, 2, 0x85], [3, 1, 0x85]],
     [[1, 1, 0x85], [2, 1, 0x85], [2, 2, 0x85], [3, 1, 0x85]],
     [[1, 1, 0x85], [2, 0, 0x85], [2, 1, 0x85], [2, 2, 0x85]],
     [[1, 1, 0x85], [2, 0, 0x85], [2, 1, 0x85], [3, 1, 0x85]]]
  ];

  // Spawn: sprite base Y $18, X $3f (IGF $200d, $2010) plus spec offsets $ef/$f0
  // (spriteData.s SpriteSpec_00) map grid cell (r, c) to field row r-1, column c+3
  // (gfx.s GetScreen0AddressOfPieceSquare). SPAWN_ROW/COL is the grid origin.
  var SPAWN_ROW = -1;
  var SPAWN_COL = 3;

  // hPieceFallingState and hRowsShiftingDownState values (constants.s).
  var FALL_NONE = 0, FALL_HIT = 1, FALL_CHECK = 2, FALL_PROCESSED = 3;
  var SHIFT_NONE = 0, SHIFT_RAM = 1, SHIFT_ROW_START = 2;

  // Row-clear timing (IGF FlashCompletedTetrisRows): 7 phases 10 frames apart,
  // then 13 frames before the RAM shift. Lock-to-check timer is 2 (IGF $2178).
  var FLASH_PHASES = 7, FLASH_INTERVAL = 10, SHIFT_WAIT = 13, CHECK_WAIT = 2;
  // Rows 0 and 1 are never checked for completion (IGF $214e: start at row 2).
  var FIRST_CHECKED_ROW = 2;
  // The score is added while the VRAM copy state equals 5 (B0 $1f9c), the level
  // is checked when row 3 is copied (IGF $239a).
  var SCORE_SHIFT_STATE = 5;
  var LEVEL_CHECK_ROW = 3;
  // A-Type stops level checks at 1000 lines (IGF $2463).
  var LEVEL_LINES_LIMIT = 1000;

  // The board holds field rows -1..17. Row -1 is the hidden tile-map row 31
  // above the field (cleared by B0 FillBottom2RowsOfTileMapWithEmptyTile).
  // A piece can reach it only with the vertical I at the top.
  function idx(row, col) { return (row + 1) * W + col; }

  function cells(type, rot) { return PIECES[type][rot]; }

  function collides(board, type, rot, row, col) {
    var cs = PIECES[type][rot];
    for (var i = 0; i < 4; i++) {
      var r = row + cs[i][0], c = col + cs[i][1];
      if (c < 0 || c >= W || r >= H) return true;
      if (r < -1) continue;
      if (board[idx(r, c)] !== EMPTY) return true;
    }
    return false;
  }

  function addScore(g, value) {
    g.score = Math.min(g.score + value, C.MAX_SCORE);
  }

  function gravityReload(level) { return C.GRAVITY[level] - 1; }

  // IGF PlayNextPieceLoadNextAndHiddenPiece ($2007). The hidden piece gets up to
  // 3 rolls; rolls 1 and 2 reroll when (candidate | preview | current) & $fc
  // equals current, with piece ids times 4 as in the ROM spec index.
  function loadNext(g) {
    g.type = g.preview;
    g.rot = 0;
    g.row = SPAWN_ROW;
    g.col = SPAWN_COL;
    g.active = true;
    var current = g.type * 4;
    var preview = g.hidden;
    var candidate;
    for (var roll = 1; ; roll++) {
      candidate = Math.floor(g.rng() * 7);
      if (roll === 3) break;
      if ((((candidate * 4) | (preview * 4) | current) & 0xfc) !== current) break;
    }
    g.preview = preview;
    g.hidden = candidate;
    g.gravCounter = g.gravReload;
  }

  function createGame(opts) {
    var startLevel = opts.startLevel | 0;
    if (startLevel < 0 || startLevel > C.MAX_START_LEVEL) throw new RangeError('startLevel');
    if (typeof opts.rng !== 'function') throw new TypeError('rng');
    var g = {
      rng: opts.rng,
      level: startLevel,
      lines: 0,
      score: 0,
      shownScore: 0,
      shownLines: 0,
      board: new Array((H + 1) * W).fill(EMPTY),
      vram: new Array(H * W).fill(EMPTY),
      type: 0, rot: 0, row: SPAWN_ROW, col: SPAWN_COL, active: false,
      // The ROM starts both specs as L (gfx.s SpriteSpecStruct_LPiece*). The hidden
      // piece starts as L too (unverified assumption: cleared HRAM).
      preview: 0,
      hidden: 0,
      fall: FALL_NONE,
      shift: SHIFT_NONE,
      timer1: 0,
      timer2: 0,
      // hStickyButtonCounter start value is not set by the in-game init. Start at
      // the full delay (unverified assumption; matters only if a side key is
      // already held at the first frame).
      sticky: C.DAS_DELAY,
      gravReload: gravityReload(startLevel),
      gravCounter: gravityReload(startLevel),
      holdCount: 0,
      canPressDown: 0,
      stuck: 0,
      flashCount: 0,
      clearRows: [],
      pendingClear: 0,
      held: { left: false, right: false, down: false },
      over: false,
      frame: 0
    };
    // B0 $1aa6..$1aac: three loads fill current, preview and hidden.
    loadNext(g); loadNext(g); loadNext(g);
    return g;
  }

  function tryShift(g, dx) {
    g.col += dx;
    if (collides(g.board, g.type, g.rot, g.row, g.col)) {
      g.col -= dx;
      // IGF $2547: a blocked move retries every frame.
      g.sticky = 1;
    }
  }

  // IGF InGameCheckButtonsPressed ($24bb). Rotate is the A button (spec index
  // minus 1), which is clockwise. Right has priority over left.
  function checkButtons(g, pressed, held, rotate) {
    if (!g.active) return;
    if (rotate) {
      var pre = g.rot;
      g.rot = (g.rot + 3) & 3;
      if (collides(g.board, g.type, g.rot, g.row, g.col)) g.rot = pre;
    }
    if (pressed.right) { g.sticky = C.DAS_DELAY; tryShift(g, 1); return; }
    if (held.right) {
      g.sticky = (g.sticky - 1) & 0xff;
      if (g.sticky !== 0) return;
      g.sticky = C.DAS_REPEAT; tryShift(g, 1); return;
    }
    if (pressed.left) { g.sticky = C.DAS_DELAY; tryShift(g, -1); return; }
    if (held.left) {
      g.sticky = (g.sticky - 1) & 0xff;
      if (g.sticky !== 0) return;
      g.sticky = C.DAS_REPEAT; tryShift(g, -1); return;
    }
    g.sticky = C.DAS_DELAY;
  }

  // IGF $20c2..$2125: move down one row, lock on collision.
  function moveDown(g, events) {
    // A hidden piece has its sprites off screen, so the ROM move has no effect.
    if (!g.active) return;
    g.row++;
    if (!collides(g.board, g.type, g.rot, g.row, g.col)) return;
    g.row--;
    g.fall = FALL_HIT;
    g.canPressDown = 1;
    if (g.holdCount !== 0) {
      // IGF $2126: A-Type adds (held steps - 1) points, not multiplied by level.
      addScore(g, g.holdCount - 1);
      g.shownScore = g.score;
      g.holdCount = 0;
    }
    if (g.row === SPAWN_ROW && g.col === SPAWN_COL) {
      // IGF $210f: the first lock at the spawn position is skipped once.
      if (g.stuck === 1) {
        g.over = true;
        events.push({ type: 'gameOver' });
      } else {
        g.stuck++;
      }
    }
  }

  // IGF InGameHandlePieceFalling ($2071, entry .start $209c).
  function handleFalling(g, pressed, held, events) {
    var downOnly = held.down && !held.left && !held.right;
    if (downOnly && !(g.canPressDown !== 0 && !pressed.down)) {
      g.canPressDown = 0;
      if (g.timer2 !== 0 || g.fall !== FALL_NONE || g.shift !== SHIFT_NONE) return;
      g.timer2 = C.SOFT_DROP_INTERVAL;
      g.holdCount = (g.holdCount + 1) & 0xff;
      moveDown(g, events);
      return;
    }
    g.holdCount = 0;
    if (g.gravCounter !== 0) { g.gravCounter--; return; }
    if (g.fall === FALL_PROCESSED || g.shift !== SHIFT_NONE) return;
    g.gravCounter = g.gravReload;
    moveDown(g, events);
  }

  // IGF InGameCheckIfAnyTetrisRowsComplete ($213e).
  function checkRows(g, events) {
    if (g.fall !== FALL_CHECK) return;
    g.clearRows = [];
    for (var r = FIRST_CHECKED_ROW; r < H; r++) {
      var full = true;
      for (var c = 0; c < W; c++) if (g.board[idx(r, c)] === EMPTY) { full = false; break; }
      if (full) g.clearRows.push(r);
    }
    g.fall = FALL_PROCESSED;
    g.timer1 = CHECK_WAIT;
    var n = g.clearRows.length;
    if (n === 0) return;
    g.lines = Math.min(g.lines + n, C.MAX_LINES);
    g.pendingClear = n;
    events.push({ type: 'clear', count: n, rows: g.clearRows.slice() });
  }

  // IGF InGameAddPieceToVram ($25a1).
  function addPiece(g, events) {
    if (g.fall !== FALL_HIT) return;
    var cs = PIECES[g.type][g.rot];
    for (var i = 0; i < 4; i++) {
      var r = g.row + cs[i][0], c = g.col + cs[i][1];
      g.board[idx(r, c)] = cs[i][2];
      if (r >= 0) g.vram[r * W + c] = cs[i][2];
    }
    g.fall = FALL_CHECK;
    g.active = false;
    events.push({ type: 'lock', piece: g.type });
  }

  // IGF ShiftEntireGameRamBufferDownARow ($224d). Rows are processed top to
  // bottom; each shift copies rows 0..r-1 down by one, then row 0 is cleared once.
  function shiftRam(g) {
    if (g.timer1 !== 0 || g.shift !== SHIFT_RAM) return;
    for (var k = 0; k < g.clearRows.length; k++) {
      for (var r = g.clearRows[k]; r >= 1; r--) {
        for (var c = 0; c < W; c++) g.board[idx(r, c)] = g.board[idx(r - 1, c)];
      }
    }
    for (var c2 = 0; c2 < W; c2++) g.board[idx(0, c2)] = EMPTY;
    g.clearRows = [];
    g.shift = SHIFT_ROW_START;
  }

  // B0 AddOnCompletedLinesScore ($1f91): score at the pre-clear level.
  function addLineScore(g) {
    if (g.shift !== SCORE_SHIFT_STATE || g.pendingClear === 0) return;
    var base = C.LINE_SCORES[g.pendingClear - 1];
    g.pendingClear = 0;
    addScore(g, base * (g.level + 1));
  }

  // IGF CheckIfATypeNextLevelReached ($244b).
  function checkLevel(g, events) {
    if (g.level === C.MAX_LEVEL) return;
    if (g.lines >= LEVEL_LINES_LIMIT) return;
    if (Math.floor(g.lines / 10) <= g.level) return;
    g.level++;
    g.gravReload = gravityReload(g.level);
    g.gravCounter = g.gravReload;
    events.push({ type: 'levelUp', level: g.level });
  }

  // IGF FlashCompletedTetrisRows ($21e0), run in VBlank.
  function flashRows(g, events) {
    if (g.fall !== FALL_PROCESSED || g.timer1 !== 0) return;
    var rows = g.clearRows, k, c;
    if ((g.flashCount & 1) === 0) {
      if (rows.length === 0) {
        loadNext(g);
        g.fall = FALL_NONE;
        events.push({ type: 'spawn', piece: g.type });
        return;
      }
      var tile = g.flashCount === FLASH_PHASES - 1 ? EMPTY : TILE_FLASH;
      for (k = 0; k < rows.length; k++) for (c = 0; c < W; c++) g.vram[rows[k] * W + c] = tile;
    } else {
      for (k = 0; k < rows.length; k++) for (c = 0; c < W; c++) g.vram[rows[k] * W + c] = g.board[idx(rows[k], c)];
    }
    g.flashCount++;
    if (g.flashCount === FLASH_PHASES) {
      g.flashCount = 0;
      g.timer1 = SHIFT_WAIT;
      g.shift = SHIFT_RAM;
      g.fall = FALL_NONE;
    } else {
      g.timer1 = FLASH_INTERVAL;
    }
  }

  // IGF CopyRamBufferRow17ToVram..Row0ToVram, one row per VBlank, bottom first.
  function copyRows(g, events) {
    if (g.shift < SHIFT_ROW_START) return;
    var r = H - 1 - (g.shift - SHIFT_ROW_START);
    for (var c = 0; c < W; c++) g.vram[r * W + c] = g.board[idx(r, c)];
    g.shift++;
    if (r === LEVEL_CHECK_ROW) checkLevel(g, events);
    if (r === 2) g.shownScore = g.score;
    if (r === 0) {
      g.canPressDown = 1;
      g.shift = SHIFT_NONE;
      g.shownLines = g.lines;
      loadNext(g);
      events.push({ type: 'spawn', piece: g.type });
    }
  }

  // input: { left, right, down } held this frame, rotate true on the press frame.
  function step(g, input) {
    var events = [];
    if (g.over) return events;
    var held = { left: !!input.left, right: !!input.right, down: !!input.down };
    var pressed = {
      left: held.left && !g.held.left,
      right: held.right && !g.held.right,
      down: held.down && !g.held.down
    };
    g.held = held;
    checkButtons(g, pressed, held, !!input.rotate);
    handleFalling(g, pressed, held, events);
    checkRows(g, events);
    addPiece(g, events);
    shiftRam(g);
    addLineScore(g);
    if (g.timer1 > 0) g.timer1--;
    if (g.timer2 > 0) g.timer2--;
    g.frame++;
    if (g.over) return events;
    flashRows(g, events);
    copyRows(g, events);
    return events;
  }

  // Cells of the falling piece in field coordinates, or [] when hidden.
  function activeCells(g) {
    if (!g.active) return [];
    return PIECES[g.type][g.rot].map(function (c) {
      return { row: g.row + c[0], col: g.col + c[1], tile: c[2] };
    });
  }

  return {
    PIECES: PIECES,
    SPAWN_ROW: SPAWN_ROW,
    SPAWN_COL: SPAWN_COL,
    EMPTY: EMPTY,
    TILE_FLASH: TILE_FLASH,
    idx: idx,
    cells: cells,
    collides: collides,
    createGame: createGame,
    step: step,
    activeCells: activeCells,
    loadNext: loadNext
  };
})();

/* ===== DATA ===== */
// All art is redrawn by hand as text. Shade keys: '.' lightest, '+' light-mid,
// 'o' dark-mid, '#' darkest. Tile positions follow the ROM layouts
// (disasm/data/layout_*.bin); the pixels are not copied from the ROM.
GB.DATA = (function () {
  'use strict';
  var SHADE = { '.': 0, '+': 1, 'o': 2, '#': 3 };

  function compile(rows) {
    if (rows.length !== 8) throw new Error('tile needs 8 rows');
    var t = new Uint8Array(64);
    for (var y = 0; y < 8; y++) {
      if (rows[y].length !== 8) throw new Error('tile row needs 8 pixels: ' + rows[y]);
      for (var x = 0; x < 8; x++) {
        var v = SHADE[rows[y][x]];
        if (v === undefined) throw new Error('bad shade ' + rows[y][x]);
        t[y * 8 + x] = v;
      }
    }
    return t;
  }

  function solid(ch) { var r = []; for (var i = 0; i < 8; i++) r.push(ch + ch + ch + ch + ch + ch + ch + ch); return r; }

  // ---- Block tiles, keyed by the ROM tile id the engine stores. ----
  var BLOCKS = {
    0x84: ['########', '#oooooo#', '#oooooo#', '#oooooo#', '#oooooo#', '#oooooo#', '#oooooo#', '########'], // L
    0x81: ['########', '#++++++#', '#+####+#', '#+#..#+#', '#+#..#+#', '#+####+#', '#++++++#', '########'], // J
    0x83: ['########', '#......#', '#.####.#', '#.####.#', '#.####.#', '#.####.#', '#......#', '########'], // O
    0x82: ['########', '#++++++#', '#++++++#', '#++##++#', '#++##++#', '#++++++#', '#++++++#', '########'], // Z
    0x86: ['########', '#oooooo#', '#o####o#', '#o#..#o#', '#o#..#o#', '#o####o#', '#oooooo#', '########'], // S
    0x85: ['########', '#++++++#', '#+....+#', '#+.++#+#', '#+.++#+#', '#+####+#', '#++++++#', '########'], // T
    // I piece: dotted bar with end caps. Horizontal left, middle, right.
    0x8a: ['########', '#+o+++o+', '#+++o+++', '#o+++++o', '#++o++++', '#+++++o+', '#+o+o+++', '########'],
    0x8b: ['########', '+++o+++o', '+o+++o++', '+++++++o', 'o++o++++', '++++o+o+', '+o++++++', '########'],
    0x8f: ['########', '++o+++o#', 'o+++o++#', '+++++++#', '+o+o+++#', '++++++o#', 'o++o+++#', '########'],
    // Vertical top, middle, bottom.
    0x80: ['########', '#++o+o+#', '#o+++++#', '#+++o++#', '#+o+++o#', '#++++++#', '#o++o++#', '#++++++#'],

// Pure renderer: a 160x144 framebuffer of shade indexes 0..3.
GB.VIEW = (function () {
  'use strict';
  var C = GB.CONST, D = GB.DATA, R = GB.RULES;
  var W = C.SCREEN_W, H = C.SCREEN_H;

  function createFramebuffer() { return new Uint8Array(W * H); }

  function fill(fb, shade) { fb.fill(shade); }

  // Draws an 8x8 tile at pixel (x, y). Pixels outside the screen are skipped.
  function blit(fb, tile, x, y) {
    for (var ty = 0; ty < 8; ty++) {
      var py = y + ty;
      if (py < 0 || py >= H) continue;
      for (var tx = 0; tx < 8; tx++) {
        var px = x + tx;
        if (px < 0 || px >= W) continue;
        fb[py * W + px] = tile[ty * 8 + tx];
      }
    }
  }

  function fillRect(fb, x, y, w, h, shade) {
    for (var py = Math.max(0, y); py < Math.min(H, y + h); py++) {
      for (var px = Math.max(0, x); px < Math.min(W, x + w); px++) fb[py * W + px] = shade;
    }
  }

  // Draws text on the tile grid. Unknown characters draw as blanks.
  function drawText(fb, text, col, row, fg, bg) {
    fg = fg === undefined ? 3 : fg;
    bg = bg === undefined ? 0 : bg;
    var str = String(text);
    for (var i = 0; i < str.length; i++) {
      var g = D.FONT[str[i]] || D.FONT[' '];
      var x0 = (col + i) * 8, y0 = row * 8;
      for (var y = 0; y < 8; y++) {
        var py = y0 + y;
        if (py < 0 || py >= H) continue;
        for (var x = 0; x < 8; x++) {
          var px = x0 + x;
          if (px < 0 || px >= W) continue;
          if (bg < 0 && !g[y * 8 + x]) continue;
          fb[py * W + px] = g[y * 8 + x] ? fg : bg;
        }
      }
    }
  }

  // Right-aligned number with no leading zeros; last digit at rightCol.
  function drawNumberRight(fb, n, rightCol, row, fg, bg) {
    var s = String(Math.max(0, Math.floor(n)));
    drawText(fb, s, rightCol - s.length + 1, row, fg, bg);
  }

  function drawLayout(fb, layout, legend) {
    for (var r = 0; r < layout.length; r++) {
      for (var c = 0; c < layout[r].length; c++) {
        var name = legend[layout[r][c]];
        if (!name) throw new Error('layout key ' + layout[r][c]);
        blit(fb, D.TILES[name], c * 8, r * 8);
      }
    }
  }

  function drawField(fb, vram) {
    for (var r = 0; r < C.FIELD_H; r++) {
      for (var c = 0; c < C.FIELD_W; c++) {
        var v = vram[r * C.FIELD_W + c];
        blit(fb, v ? D.BLOCKS[v] : D.TILES.empty, D.FIELD_X + c * 8, D.FIELD_Y + r * 8);
      }
    }
  }

  function drawPiece(fb, cells, x0, y0) {
    for (var i = 0; i < cells.length; i++) {
      var cell = cells[i];
      if (cell.row < 0) continue; // above the field: no sprite shown
      blit(fb, D.BLOCKS[cell.tile], x0 + cell.col * 8, y0 + cell.row * 8);
    }
  }

  // Play screen. opts.label: text centered on the field (for example PAUSE).
  function renderPlay(fb, game, opts) {
    opts = opts || {};
    drawLayout(fb, D.LAYOUT_PLAY, D.LEGEND_PLAY);
    D.TEXT_PLAY.forEach(function (t) { drawText(fb, t[0], t[1], t[2]); });
    drawField(fb, game.vram);
    if (!opts.hidePieces) {
      drawPiece(fb, R.activeCells(game), D.FIELD_X, D.FIELD_Y);
      var next = R.cells(game.preview, 0).map(function (c) { return { row: c[0], col: c[1], tile: c[2] }; });
      drawPiece(fb, next, D.NEXT_X, D.NEXT_Y);
    }
    drawNumberRight(fb, game.shownScore, D.POS_SCORE[0], D.POS_SCORE[1]);
    drawNumberRight(fb, game.level, D.POS_LEVEL[0], D.POS_LEVEL[1]);
    drawNumberRight(fb, game.shownLines, D.POS_LINES[0], D.POS_LINES[1]);
    if (opts.label) drawFieldLabel(fb, opts.label);
  }

  // A boxed label across the middle of the field.
  function drawFieldLabel(fb, text) {
    var col = 2 + Math.floor((10 - text.length) / 2);
    fillRect(fb, 16, 60, 80, 24, 0);
    fillRect(fb, 16, 61, 80, 1, 3);
    fillRect(fb, 16, 82, 80, 1, 3);
    drawText(fb, text, col, 8);
  }

  // ---- Pixel primitives for menu art. ----
  function pset(fb, x, y, shade) {
    if (x >= 0 && x < W && y >= 0 && y < H) fb[y * W + x] = shade;
  }

  // Fills a polygon (scanline, pixel centers). pts: [[x, y], ...].
  function fillPoly(fb, pts, shade) {
    var minY = Infinity, maxY = -Infinity, i;
    for (i = 0; i < pts.length; i++) { minY = Math.min(minY, pts[i][1]); maxY = Math.max(maxY, pts[i][1]); }
    for (var y = Math.ceil(minY); y < maxY; y++) {
      var cy = y + 0.5, xs = [];
      for (i = 0; i < pts.length; i++) {
        var a = pts[i], b = pts[(i + 1) % pts.length];
        if ((a[1] <= cy && b[1] > cy) || (b[1] <= cy && a[1] > cy)) {
          xs.push(a[0] + (cy - a[1]) * (b[0] - a[0]) / (b[1] - a[1]));
        }
      }
      xs.sort(function (p, q) { return p - q; });
      for (var k = 0; k + 1 < xs.length; k += 2) {
        for (var x = Math.ceil(xs[k] - 0.5); x < Math.ceil(xs[k + 1] - 0.5); x++) pset(fb, x, y, shade);
      }
    }
  }

  function fillCircle(fb, cx, cy, r, shade) {
    for (var y = -r; y <= r; y++) for (var x = -r; x <= r; x++) {
      if (x * x + y * y <= r * r + r) pset(fb, cx + x, cy + y, shade);
    }
  }

  function tileRect(fb, tile, col, row, w, h) {
    for (var r = row; r < row + h; r++) for (var c = col; c < col + w; c++) blit(fb, tile, c * 8, r * 8);
  }

  // Rounded box in pixels: darkest 2px outline, lightest inside.
  function drawBox(fb, x, y, w, h) {
    fillRect(fb, x + 1, y, w - 2, h, 3);
    fillRect(fb, x, y + 1, w, h - 2, 3);
    fillRect(fb, x + 2, y + 2, w - 4, h - 4, 0);
  }

  // ---- Title screen (layout_titleScreen.bin structure, art redrawn). ----
  // Logo letter stem: outlined bar with the four shade bands of the logo.
  function stem(fb, x, y, w, h) {
    fillRect(fb, x, y, w, h, 3);
    var bands = [0, 1, 2];
    var bh = Math.floor((h - 2) / 4);
    for (var i = 0; i < 3; i++) fillRect(fb, x + 2, y + 2 + i * bh, w - 4, bh, bands[i]);

  // Logo wedge: darkest triangle with a dark-mid core.
  function wedge(fb, pts) {
    fillPoly(fb, pts, 3);
    var cx = 0, cy = 0;
    pts.forEach(function (p) { cx += p[0] / pts.length; cy += p[1] / pts.length; });
    fillPoly(fb, pts.map(function (p) { return [cx + (p[0] - cx) * 0.45, cy + (p[1] - cy) * 0.45]; }), 2);
  }

  function drawLogo(fb) {
    var top = 14, h = 34;
    // T
    wedge(fb, [[10, top], [17, top], [17, top + 11]]);
    stem(fb, 17, top, 7, h);
    wedge(fb, [[24, top], [31, top], [24, top + 11]]);
    // E
    stem(fb, 35, top, 7, h);
    wedge(fb, [[42, top], [50, top], [42, top + 11]]);
    wedge(fb, [[43, top + 17], [50, top + 10], [50, top + 24]]);
    wedge(fb, [[42, top + h], [50, top + h], [42, top + h - 11]]);
    // T
    wedge(fb, [[54, top], [61, top], [61, top + 11]]);
    stem(fb, 61, top, 7, h);
    wedge(fb, [[68, top], [75, top], [68, top + 11]]);
    // R
    stem(fb, 79, top, 7, h);
    fillPoly(fb, [[86, top], [92, top], [97, top + 5], [97, top + 12], [92, top + 17], [86, top + 17]], 3);
    fillPoly(fb, [[86, top + 4], [90, top + 4], [92, top + 7], [92, top + 10], [90, top + 13], [86, top + 13]], 1);
    fillPoly(fb, [[86, top + 17], [92, top + 17], [99, top + h], [93, top + h]], 3);

    // S: slanted band with end wedges
    fillPoly(fb, [[113, top], [130, top], [130, top + 6], [119, top + 6]], 3);

    var tm = ['###.#...#', '.#..##.##', '.#..#.#.#', '.#..#...#'];
    for (var y = 0; y < tm.length; y++) for (var x = 0; x < tm[y].length; x++) {

  // Onion dome: striped bulb with a spire and knob.
  function drawDome(fb, cx, base, halfW, height) {
    var pts = [], i, t;
    for (i = 0; i <= 16; i++) {
      t = i / 16; // 0 top .. 1 base
      var w = halfW * Math.pow(Math.sin(Math.PI * Math.min(1, t * 0.95 + 0.05) * 0.75), 1.6);
      pts.push([cx + w, base - height + t * height]);
    }
    for (i = 16; i >= 0; i--) {
      t = i / 16;
      var w2 = halfW * Math.pow(Math.sin(Math.PI * Math.min(1, t * 0.95 + 0.05) * 0.75), 1.6);
      pts.push([cx - w2, base - height + t * height]);

    var inner = pts.map(function (p) { return [cx + (p[0] - cx) * 0.86, base - (base - p[1]) * 0.94]; });
    fillPoly(fb, inner, 0);

    for (var s = -2; s <= 2; s++) {
      if (s === 0) continue;
      var band = [];

            app.bindings = next;
            store.save('bindings', next);
          });
        },
        update: function (inp) {
          app.keys.step(inp.codes || []);
          if (app.keys.done) go('title');
        },
        render: function (fb) { V.renderKeys(fb, app.keys, app.bindings); }
      },
      nameEntry: {
        enter: function () { app.entry = createNameEntry(); },
        update: function (inp) {
          var name = app.entry.step(inp);
          if (name === null) return;
          var res = insertScore(app.scores, { name: name, score: app.play.game.score });
          app.scores = res.list;
          store.save('scores', app.scores);
          go('title');
        },
        render: function (fb) {
          V.renderNameEntry(fb, app.entry, app.play.game.score, app.entryRank);
        }
      },
      levelSelect: {
        enter: function () { app.timer = 0; app.blinkOn = true; },
        update: function (inp) {
          if (inp.pressed.start) { go('play'); return; }
          app.level = levelSelectMove(app.level, inp.pressed);
          if (++app.timer >= BLINK_FRAMES) { app.timer = 0; app.blinkOn = !app.blinkOn; }
        },
        render: function (fb) { V.renderLevelSelect(fb, app.level, app.blinkOn, app.scores.slice(0, 3)); }
      },
      play: {
        enter: function () { app.play = createPlay({ startLevel: app.level, rng: opts.rng }); },
        update: function (inp) {
          app.play.step(inp);
          if (app.play.game.over) go('gameOver');
        },
        render: function (fb) { app.play.render(fb); }
      },
      gameOver: {
        enter: function () { app.timer = 0; },
        update: function (inp) {
          app.timer++;
          if (app.timer >= GAME_OVER_FRAMES || (app.timer >= GAME_OVER_SKIP && inp.pressed.start)) {
            var score = app.play.game.score;
            if (qualifies(app.scores, score)) {
              app.entryRank = rankOf(app.scores, score);
              go('nameEntry');
            } else {
              go('title');
            }
          }
        },
        render: function (fb) { app.play.render(fb, 'GAME OVER'); }
      }
    };

    function go(name) {
      app.screen = name;
      screens[name].enter();
    }

    app.step = function (inp) { screens[app.screen].update(inp); };
    app.render = function (fb) { screens[app.screen].render(fb); };
    // Blur or hidden tab.
    app.pause = function () { if (app.screen === 'play') app.play.pause(); };
    app.go = go;

    go('title');
    return app;
  }

  return {
    createTicker: createTicker,
    ACTIONS: ACTIONS,
    DEFAULT_BINDINGS: DEFAULT_BINDINGS,
    createInput: createInput,
    createPlay: createPlay,
    levelSelectMove: levelSelectMove,
    NAME_CHARS: NAME_CHARS,
    validateScores: validateScores,
    qualifies: qualifies,
    rankOf: rankOf,
    insertScore: insertScore,
    createStore: createStore,
    createNameEntry: createNameEntry,
    RESERVED: RESERVED,
    checkBinding: checkBinding,
    validateBindings: validateBindings,
    keyLabel: keyLabel,
    KEY_ROWS: KEY_ROWS,
    createKeysScreen: createKeysScreen,
    GAME_OVER_FRAMES: GAME_OVER_FRAMES,
    GAME_OVER_SKIP: GAME_OVER_SKIP,
    createApp: createApp
  };
})();

/* ==END LOGIC== */
</script>

<script>
/* ===== PLATFORM ===== */
var PLATFORM = (function () {
  'use strict';
  var C = GB.CONST, V = GB.VIEW;
  var SW = C.SCREEN_W, SH = C.SCREEN_H;

  function rgba(hex) {
    var n = parseInt(hex.slice(1), 16);
    return [n >> 16, (n >> 8) & 255, n & 255, 255];
  }
  var PAL = C.PALETTE.map(rgba);

  // Screen: framebuffer -> 160x144 ImageData -> integer-scaled visible canvas.
  function createScreen(canvas) {
    var off = document.createElement('canvas');
    off.width = SW; off.height = SH;
    var offCtx = off.getContext('2d');
    var image = offCtx.createImageData(SW, SH);
    var ctx = canvas.getContext('2d');
    var fb = V.createFramebuffer();

    // Backing store at the largest integer factor that fits the shown size.
    // CSS stretches the small remainder with image-rendering: pixelated.
    function resize(cssW, cssH) {
      var k = Math.max(1, Math.floor(Math.min(cssW / SW, cssH / SH)));
      if (canvas.width !== SW * k) { canvas.width = SW * k; canvas.height = SH * k; }
    }

    function present() {
      var d = image.data;
      for (var i = 0; i < fb.length; i++) {
        var p = PAL[fb[i]], j = i * 4;
        d[j] = p[0]; d[j + 1] = p[1]; d[j + 2] = p[2]; d[j + 3] = 255;
      }
      offCtx.putImageData(image, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
    }

    return { fb: fb, resize: resize, present: present };
  }

  // Fits the canvas to the window, keeping the 160:144 aspect.
  function fitToWindow(canvas, screen) {
    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.min(w / SW, h / SH);
    var cssW = Math.floor(SW * s), cssH = Math.floor(SH * s);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    screen.resize(cssW, cssH);
  }

  // Runs app.step() at the fixed game rate and app.render(fb) once per
  // animation frame.
  function startLoop(app, screen) {
    var ticker = GB.APP.createTicker(C.FPS, 5);
    function frame(now) {
      var n = ticker.advance(now);
      for (var i = 0; i < n; i++) app.step();
      app.render(screen.fb);
      screen.present();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    return ticker;
  }

  // Keyboard, blur and visibility. onAway runs when the page loses focus or
  // is hidden; onBack runs when it is visible again.
  function bindInput(input, onAway, onBack) {
    window.addEventListener('keydown', function (e) {
      if (input.keyDown(e)) e.preventDefault();
    });
    window.addEventListener('keyup', function (e) {
      if (input.keyUp(e)) e.preventDefault();
    });
    window.addEventListener('blur', onAway);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) onAway(); else onBack();
    });
  }

  return { createScreen: createScreen, fitToWindow: fitToWindow, startLoop: startLoop, bindInput: bindInput };
})();

/* ===== BOOT ===== */
(function () {
  'use strict';
  var canvas = document.getElementById('screen');
  var notice = document.getElementById('notice');
  var screen = PLATFORM.createScreen(canvas);
  PLATFORM.fitToWindow(canvas, screen);
  window.addEventListener('resize', function () { PLATFORM.fitToWindow(canvas, screen); });

  var store = GB.APP.createStore(function () { return window.localStorage; });
  var app = GB.APP.createApp({ rng: Math.random, store: store });
  var input = GB.APP.createInput(function () { return app.bindings; });
  var ticker = PLATFORM.startLoop({
    step: function () { app.step(input.frame()); },
    render: function (fb) {
      app.render(fb);
      notice.hidden = store.ok;
    }
  }, screen);
  PLATFORM.bindInput(input, function () {
    input.clear();
    app.pause();
  }, function () { ticker.reset(); });
  // Read-only handle for end-to-end tests.
  window.gbApp = app;
})();
</script>
